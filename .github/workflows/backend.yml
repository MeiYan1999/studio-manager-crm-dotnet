name: StudioCore Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore tests/StudioCore.Tests/StudioCore.Tests.csproj
      - name: Build
        run: dotnet build tests/StudioCore.Tests/StudioCore.Tests.csproj -c Release --no-restore
      - name: Unit and persistence tests
        run: dotnet test tests/StudioCore.Tests/StudioCore.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults
      - name: API and S3 smoke tests (temporary data only)
        run: python3 tests/run_backend.py
      - name: Publish validation
        run: dotnet publish StudioCore.csproj -c Release --no-restore -o "${{ runner.temp }}/studiocore-publish"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
