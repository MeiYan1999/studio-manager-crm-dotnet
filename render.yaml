services:
  - type: web
    name: studio-manager-crm-dotnet
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Saas__BaseDomain
        value: studiocore.io.vn
      - key: Saas__PublicOrigin
        value: https://studiocore.io.vn
      - key: AdminCode
        sync: false
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: studio-manager-crm-db
          property: connectionString
      - key: CloudflareR2__ServiceUrl
        sync: false
      - key: CloudflareR2__BucketName
        sync: false
      - key: CloudflareR2__AccessKey
        sync: false
      - key: CloudflareR2__SecretKey
        sync: false

databases:
  - name: studio-manager-crm-db
    plan: basic-256mb
    databaseName: studio_manager_crm
    user: studio_manager_crm
